<body>

                <br>

                <p>--------- ou ultilize sua conta --------------</p>

                <label for="Acesar-Goggle"> Goggle </label>
                <input type="text" id="Acesar-Goggle" placeholder="Goggle">

                <p>Protegido por reCAPTCHA - Privacidade | Condições </p>
            </form>
        </section>
    </main>
