<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="*">
        <table>
            <tr><td colspan="2"><b>Identificação do Usuário</b></td></tr>

            <tr>
                <td>
                    <label for="campo_nome"> <b>Nome</b></label>
                </td>

                <td> 
                    <input type="text" id="campo_nome" size="15" max="30">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="campo_senha"><b>Senha</b></label>
                </td>
                <td>
                    <input type="password" id="campo_senha" size="15" maxlength="30">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="campo_CPF"><b>CPF</b></label>
                </td>
                <td>
                    <input type="text" id="campo_CPF" size="10" maxlength="15">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="campo_sexo"><b>Sexo</b></label>
                </td>

                <td>
                    <select name="Sexo" id="">
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                    </select>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
